window.maheunSaveConnection=async()=>{const v=window.maheunLocal?.();if(!v?.name||v.metYear===''||v.metYear===null||v.metYear===undefined)return;if(!auth.currentUser){set({connectionStatus:'Firebase 연결 후 저장할게요. 저장 상태를 다시 확인해 주세요.'});return}try{const ref=doc(db,'connections',auth.currentUser.uid);const old=await getDoc(ref);const fields={name:v.name.slice(0,30),year:Number(v.metYear),showOnMap:!!v.showOnMap};if(old.exists())await updateDoc(ref,fields);else await setDoc(ref,{...fields,createdAt:serverTimestamp()});window.maheunConnectionPending=false;set({connectionStatus:'인연 연도 저장 완료! 💞'})}catch(e){set({connectionStatus:'인연 기록 저장 오류: '+niceErr(e)+' · 다시 저장하려면 연도 수정으로 들어가 주세요.'})}};
window.maheunPublishScore=async()=>{const v=window.maheunLocal?.();if(!v?.completed){alert('두 퀴즈를 모두 완료해 주세요.');return}if(!auth.currentUser){set({saveStatus:'Firebase 연결을 확인해 주세요.'});return}try{await setDoc(doc(db,'scores',auth.currentUser.uid),{name:v.name.slice(0,30),score:v.score,createdAt:serverTimestamp()});set({saveStatus:'내 점수가 전체 랭킹에 등록됐어요! 🎉'})}catch(e){set({saveStatus:e?.code==='permission-denied'?'이미 제출했거나 권한이 없어요. 같은 계정에서는 한 번만 제출할 수 있어요.':niceErr(e)})}};
window.maheunSendWord=async()=>{const v=window.maheunLocal?.();if(!v?.word?.trim()){set({wordStatus:'작성한 답변이 없어 전송하지 않았어요.'});return}if(!v.name){set({wordStatus:'이름을 입력한 뒤 제출해 주세요.'});return}if(!auth.currentUser){set({wordStatus:'Firebase에 연결되지 않았어요. 잠시 후 다시 보내기를 눌러주세요.'});return}try{await setDoc(doc(db,'words',auth.currentUser.uid),{name:v.name.slice(0,30),word:v.word.trim().slice(0,100),createdAt:serverTimestamp()});set({wordStatus:'성은주에게 12번 답변이 전달됐어요! 💗'})}catch(e){set({wordStatus:e?.code==='permission-denied'?'이미 전달한 답변이거나 권한이 없어요. Firebase 규칙을 확인해 주세요.':niceErr(e)})}};
window.maheunSendMemory=async()=>{const v=window.maheunLocal?.();if(!v?.message?.trim()){alert('메시지를 입력해 주세요.');return}if(!v.name){alert('이름을 먼저 입력해 주세요.');return}if(!auth.currentUser){set({memoryStatus:'Firebase 연결을 확인해 주세요.'});return}try{await setDoc(doc(db,'memories',auth.currentUser.uid),{name:v.name.slice(0,30),prompt:v.prompt,message:v.message.slice(0,1000),createdAt:serverTimestamp()});set({memoryStatus:'성은주에게 비공개로 전달했어요! 💌'});alert('메시지를 보냈어요! 💌')}catch(e){set({memoryStatus:e?.code==='permission-denied'?'이미 메시지를 보냈거나 권한이 없어요.':niceErr(e)})}};
window.maheunAdminLogin=async(email,password)=>{if(!email||!password){set({adminError:'이메일과 비밀번호를 입력해 주세요.'});return}try{const r=await signInWithEmailAndPassword(auth,email,password);if(r.user.uid!==ADMIN){await signOut(auth);set({adminError:'관리자 계정이 아닙니다.'})}}catch(e){set({adminError:niceErr(e)})}};
window.maheunResetCloud=async()=>{
 if(!auth.currentUser||auth.currentUser.uid!==ADMIN){set({resetStatus:'관리자 계정으로 로그인해야 합니다.'});return}
 if(window.maheunResetInProgress)return;
 const phrase=prompt('주의: Firebase의 점수, 기억 한 줄, 12번 주관식, 인연지도 기록이 모두 영구 삭제됩니다. 계속하려면 [전체삭제]를 정확히 입력하세요.');
 if(phrase!=='전체삭제'){set({resetStatus:'삭제가 취소되었습니다.'});return}
 if(!confirm('정말 모든 참가자의 기록을 영구 삭제할까요? 복구할 수 없습니다.')){set({resetStatus:'삭제가 취소되었습니다.'});return}
 window.maheunResetInProgress=true;set({resetBusy:true,resetStatus:'기록을 삭제하고 있어요. 페이지를 닫지 마세요.'});
 let n=0;
 try{
  const refs=[];
  for(const name of ['scores','memories','words','connections']){
   const snap=await getDocs(collection(db,name));
   for(const d of snap.docs)refs.push(d.ref);
  }
  for(let i=0;i<refs.length;i+=400){
   const batch=writeBatch(db);for(const ref of refs.slice(i,i+400))batch.delete(ref);
   await batch.commit();n+=Math.min(400,refs.length-i);
   set({resetStatus:`${n}개 기록을 삭제했어요…`});
  }
  set({resetStatus:n?`Firebase 기록 ${n}개를 삭제했어요. 이제 새로 테스트할 수 있어요.`:'삭제할 기록이 없습니다.'});
 }catch(e){set({resetStatus:`${n}개 삭제 후 오류가 발생했어요: ${niceErr(e)}. 다시 실행하면 남은 기록을 삭제할 수 있어요.`})}
 finally{window.maheunResetInProgress=false;set({resetBusy:false})}
};
window.maheunAdminLogout=async()=>{try{await signOut(auth);set({adminMemories:[],adminWords:[],isAdmin:false})}catch(e){set({adminError:niceErr(e)})}};
</script></body></html>
