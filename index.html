if(state.page==='quiz') {const i=state.quizIndex,q=questions[i];s=`${header}<h2>📝 성은주 능력시험</h2><div class="tiny muted">객관식 11문항 · 모두 동일 배점 · 정답 개수 ÷ 11 × 100점(반올림)<br>마지막 자유답변 1문항은 채점하지 않아.</div>${state.quizSubmitted?`<div class="card center"><h2>시험 완료!</h2><div class="resultscore">${quizScore()}<small style="font-size:19px">/ 100</small></div><p>객관식 ${correctCount()} / 11문제 정답</p><p class="tiny muted">마지막 한 단어: ${esc(state.word||'미작성')}<br>작성한 단어는 이 브라우저에만 저장돼.</p></div>${button('명예의 전당 보기','ranking')}`:i===questions.length?`<div class="progress"><div style="width:100%"></div></div><div class="muted tiny">QUESTION 12 / 12 · 자유답변 (점수 없음)</div><h2>Q12. 성은주 하면 가장 먼저 떠오르는 단어는?</h2><p class="tiny muted">한 단어만 남겨줘! 정답은 없고 시험 점수에도 영향을 주지 않아.</p><input class="field" id="word" maxlength="100" placeholder="예: 행복, 소고기, 웃음" value="${esc(state.word)}"><p class="tiny muted">⚠️ 현재는 이 기기에만 저장돼. 은주에게 자동 전송되지는 않아.</p><div class="space"></div><div class="btnrow">${button('← 이전','quizPrev','outline')}${button('제출하고 채점하기','quizNext')}</div>`:`<div class="progress"><div style="width:${(i+1)/12*100}%"></div></div><div class="muted tiny">QUESTION ${i+1} / 12 · 객관식</div><h2>Q${i+1}. ${q[0]}</h2>${q[1].map((o,j)=>`<button class="option ${state.quizAnswers[i]===j?'selected':''}" data-do="answerQuiz" data-val="${j}">${'ABCD'[j]}. ${esc(o)}</button>`).join('')}<div class="space"></div><div class="btnrow">${button('← 이전','quizPrev','outline')}${button('다음 →','quizNext')}</div><p class="tiny muted center">정답은 최종 제출 전에는 표시되지 않아.</p>`}`;}

평범했던 하루가 얼마나 소중한지,

s+=`<p class="foot">마흔.zip · 모바일 프로토타입 v5<br>실제 공개 서비스·공유 QR·서버 저장 기능은 아직 연결되지 않았습니다.</p>`;root.innerHTML=s;
const sections=[['home','🏠','홈'],['quiz','🏆','능력시험'],['photos','📸','사진'],['ranking','🥇','랭킹'],['memory','💌','기억']];nav.innerHTML=state.page==='welcome'?'':sections.map(x=>`<button class="${x[0]===state.page?'active':''}" data-do="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('');
}
function go(p){state.page=p;window.scrollTo({top:0});render()}
function action(doit,val){if(['home','quiz','photos','ranking','memory','thanks','welcome'].includes(doit)){go(doit);return}if(doit==='enter'){let v=document.getElementById('name').value.trim();if(!v){alert('이름이나 별명을 입력해줘!');return}state.name=v;persist();go('home')}if(doit==='answerQuiz'){if(state.quizSubmitted)return;state.quizAnswers[state.quizIndex]=Number(val);persist();render()}if(doit==='quizPrev'){state.quizIndex=Math.max(0,state.quizIndex-1);render()}if(doit==='quizNext'){if(state.quizIndex<questions.length&&state.quizAnswers[state.quizIndex]===undefined){alert('답을 하나 선택해줘!');return}if(state.quizIndex===questions.length){state.word=(document.getElementById('word')?.value||'').trim();state.quizSubmitted=true;persist()}else state.quizIndex++;render()}if(doit==='answerPhoto'){if(state.photosSubmitted)return;state.photoAnswers[state.photoIndex]=Number(val);persist();render()}if(doit==='photoPrev'){state.photoIndex=Math.max(0,state.photoIndex-1);render()}if(doit==='photoNext'){if(state.photoAnswers[state.photoIndex]===undefined){alert('연도를 하나 골라줘!');return}if(state.photoIndex===photos.length-1){state.photosSubmitted=true;persist()}else state.photoIndex++;render()}if(doit==='saveLetter'){const v=document.getElementById('letter').value.trim();if(!v){alert('한 줄만 적어줘!');return}state.letter=v;persist();alert('이 기기에 저장했어! 💌 (은주에게 전송되지는 않아)');go('thanks')}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-do]');if(b)action(b.dataset.do,b.dataset.val)});document.addEventListener('change',e=>{if(e.target.id==='prompt')state.prompt=e.target.value});document.addEventListener('input',e=>{if(e.target.id==='letter')state.letter=e.target.value;if(e.target.id==='word'){state.word=e.target.value;persist()}});render();
})();</script></body></html>
